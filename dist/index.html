<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIPO Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } } }
  </script>
  <style>
    body { background: #030712; color: #f3f4f6; font-family: 'Cairo', sans-serif; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .modal-box { background: #0d131a; border: 1px solid #1f2a33; border-radius: 24px; padding: 40px; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .loader { width: 40px; height: 40px; border: 4px solid #1f2937; border-top-color: #06b6d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .video-card { background: #0d131a; border: 1px solid #1f2a33; border-radius: 20px; padding: 20px; margin-top: 20px; }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #2563eb); color: #000; font-weight: bold; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
    .btn-danger { background: #dc2626; color: #fff; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }
    .btn-success { background: #16a34a; color: #fff; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ============================================================
  نموذج تسجيل الدخول
  ============================================================ -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box text-center">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-3xl font-black text-slate-950 shadow-lg shadow-cyan-500/25">P</div>
      <h2 class="text-2xl font-bold text-white mt-4">مرحباً بك في PIPO</h2>
      <p class="text-slate-400 text-sm mt-2">سجل دخولك للاستمرار</p>

      <div class="mt-6 text-start">
        <label class="text-xs font-bold text-slate-300">الاسم الأول</label>
        <input id="firstName" type="text" placeholder="أحمد" class="w-full mt-1 p-3 rounded-xl bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        <label class="text-xs font-bold text-slate-300 mt-4 block">اللقب</label>
        <input id="lastName" type="text" placeholder="المصري" class="w-full mt-1 p-3 rounded-xl bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
      </div>

      <button id="loginBtn" class="w-full mt-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 hover:opacity-90 transition">دخول 🚀</button>
      <p class="text-[10px] text-slate-500 mt-4">تطوير: <span class="text-cyan-400">PIPO (@amirx_xpipo)</span></p>
    </div>
  </div>

  <!-- ============================================================
  الموقع الرئيسي
  ============================================================ -->
  <div id="app" style="display: none;">
    <div class="max-w-4xl mx-auto px-4 py-8">
      <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-2xl font-black text-slate-950 shadow-lg shadow-cyan-500/25">P</div>
          <div>
            <div class="text-2xl font-black bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent">PIPO</div>
            <p class="text-xs text-slate-400">تحميل الفيديوهات بدون علامة مائية</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="userDisplay" class="text-sm text-cyan-400 font-bold"></span>
          <button id="logoutBtn" class="text-xs text-slate-400 hover:text-white">تسجيل خروج</button>
        </div>
      </header>

      <!-- لوحة المطور -->
      <div id="adminPanel" style="display: none;" class="mb-6 p-4 rounded-xl bg-slate-900 border border-cyan-500/30">
        <h3 class="text-lg font-bold text-cyan-400">👑 لوحة تحكم المطور</h3>
        <p class="text-xs text-slate-400 mb-3">إدارة المستخدمين المسجلين</p>
        <button id="refreshUsersBtn" class="btn-primary text-sm py-1 px-4">🔄 تحديث</button>
        <div id="usersList" class="mt-3 space-y-2"></div>
      </div>

      <!-- محرك البحث -->
      <div class="flex flex-col sm:flex-row gap-3 bg-slate-900 border border-slate-700 rounded-2xl p-2 shadow-xl">
        <input id="urlInput" type="text" placeholder="ضع رابط الفيديو هنا (TikTok, YouTube...)" class="flex-1 bg-transparent px-4 py-3 text-white text-sm focus:outline-none" dir="ltr" />
        <button id="searchBtn" class="btn-primary text-sm py-3 px-6">استخراج ⚡</button>
      </div>

      <!-- حالة التحميل -->
      <div id="loadingIndicator" class="hidden text-center py-4">
        <div class="loader"></div>
        <p class="text-cyan-400 text-sm">جاري استخراج الفيديو...</p>
      </div>

      <!-- الأخطاء -->
      <div id="errorMsg" class="hidden mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm"></div>

      <!-- نتيجة الفيديو -->
      <div id="videoResult" class="hidden video-card">
        <div class="flex flex-col md:flex-row gap-6">
          <div class="md:w-2/5">
            <img id="videoThumbnail" class="w-full rounded-xl" src="" alt="Thumbnail" />
            <div class="mt-2 text-xs text-slate-400">
              <span id="videoAuthor" class="text-white font-bold"></span> • <span id="videoUsername"></span>
            </div>
          </div>
          <div class="md:w-3/5">
            <h3 id="videoTitle" class="text-lg font-bold text-white"></h3>
            <p class="text-xs text-slate-400 mt-1">⏱️ <span id="videoDuration"></span> • 👁️ <span id="videoViews"></span></p>
            <div id="formatsContainer" class="mt-4 space-y-2"></div>
          </div>
        </div>
      </div>

      <footer class="mt-12 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
        PIPO Video Downloader © 2026 | تطوير: <a href="https://t.me/amirx_xpipo" class="text-cyan-400 font-bold">PIPO (@amirx_xpipo)</a>
      </footer>
    </div>
  </div>

  <!-- ============================================================
  Scripts
  ============================================================ -->
  <script>
    let currentUser = null;
    let currentVideo = null;

    // ============================================================
    //  تسجيل الدخول
    // ============================================================
    async function login(firstName, lastName) {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName })
      });
      return await res.json();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      if (!firstName || !lastName) return alert('الرجاء إدخال الاسم واللقب');

      const result = await login(firstName, lastName);
      if (result.success) {
        currentUser = result.user;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userDisplay').textContent = `👤 ${currentUser.fullName}`;

        if (currentUser.isAdmin || currentUser.fullName === 'PIPO Admin') {
          document.getElementById('adminPanel').style.display = 'block';
          loadUsers();
        }
      } else {
        alert(result.error || 'حدث خطأ');
      }
    });

    // ============================================================
    //  تسجيل الخروج
    // ============================================================
    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('firstName').value = '';
      document.getElementById('lastName').value = '';
    });

    // ============================================================
    //  استخراج الفيديو
    // ============================================================
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return alert('الرجاء إدخال رابط');

      document.getElementById('loadingIndicator').classList.remove('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('videoResult').classList.add('hidden');

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'فشل الاستخراج');

        currentVideo = data;
        displayVideo(data);
      } catch (err) {
        document.getElementById('errorMsg').textContent = err.message;
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        document.getElementById('loadingIndicator').classList.add('hidden');
      }
    });

    function displayVideo(video) {
      document.getElementById('videoThumbnail').src = video.thumbnailUrl;
      document.getElementById('videoTitle').textContent = video.title;
      document.getElementById('videoAuthor').textContent = video.author.name;
      document.getElementById('videoUsername').textContent = video.author.username;
      document.getElementById('videoDuration').textContent = video.durationFormatted;
      document.getElementById('videoViews').textContent = video.views || 'غير معروف';

      const container = document.getElementById('formatsContainer');
      container.innerHTML = '';
      video.formats.forEach(fmt => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800';
        div.innerHTML = `
          <div>
            <div class="text-xs font-bold text-white">${fmt.label}</div>
            <div class="text-[10px] text-slate-400">${fmt.quality} • ${fmt.estimatedSize}</div>
          </div>
          <a href="${fmt.downloadUrl}" download class="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition">تنزيل 📥</a>
        `;
        container.appendChild(div);
      });

      document.getElementById('videoResult').classList.remove('hidden');
    }

    // ============================================================
    //  لوحة تحكم المطور (جلب المستخدمين)
    // ============================================================
    async function loadUsers() {
      const token = 'PIPO_ADMIN_2026';
      const res = await fetch('/api/users', {
        headers: { 'x-admin-token': token }
      });
      const data = await res.json();
      if (data.users) {
        const list = document.getElementById('usersList');
        list.innerHTML = data.users.map(u => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800">
            <div>
              <div class="text-xs font-bold text-white">${u.fullName}</div>
              <div class="text-[10px] text-slate-400">${u.firstName} ${u.lastName} • ${u.isBanned ? '🚫 محظور' : '✅ نشط'}</div>
            </div>
            <div>
              ${u.isBanned
                ? `<button onclick="unbanUser('${u.id}')" class="btn-success text-xs py-1 px-3">فك الحظر</button>`
                : `<button onclick="banUser('${u.id}')" class="btn-danger text-xs py-1 px-3">حظر</button>`
              }
            </div>
          </div>
        `).join('');
      }
    }

    async function banUser(userId) {
      if (!confirm('هل أنت متأكد من حظر هذا المستخدم؟')) return;
      const token = 'PIPO_ADMIN_2026';
      await fetch('/api/ban-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify({ userId })
      });
      loadUsers();
    }

    async function unbanUser(userId) {
      const token = 'PIPO_ADMIN_2026';
      await fetch('/api/unban-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify({ userId })
      });
      loadUsers();
    }

    document.getElementById('refreshUsersBtn').addEventListener('click', loadUsers);

    // ============================================================
    //  تشغيل البحث بالضغط على Enter
    // ============================================================
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });
  </script>
</body>
</html>
